service: py-example6-sqs-post
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.8
  profile: default
  region: eu-central-1
  stage: dev
  # tag standard sulle risorse dello stack CloudFormation (convenzione in CLAUDE.md)
  stackTags:
    Name: aws-py-Lambda.py-example6-sqs-post
    Environment: dev
    Project: Development.aws.py-Lambda.py-example6-sqs-post
    Owner: AlNao
    CostCenter: dev
    ManagedBy: Sh
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action: "sqs:*"
          Resource: "*" 

functions:
  sqspost:
    handler: handler.lambda_handler
