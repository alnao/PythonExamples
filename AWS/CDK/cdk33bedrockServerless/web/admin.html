<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket RAG serverless - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container flex-wrap gap-2">
            <a class="navbar-brand" href="index.html"><i class="bi bi-robot"></i> Pocket RAG · Admin</a>
            <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
                <span class="navbar-text">
                    <span id="statusIndicator" class="status-indicator status-checking"></span>
                    <span id="statusText">Verifica...</span>
                </span>
                <input type="password" class="form-control form-control-sm api-key" id="apiKey"
                       placeholder="API key" title="Chiave delle API (header X-API-Key), salvata in questo browser">
                <a class="btn btn-outline-light btn-sm" href="index.html"><i class="bi bi-house"></i> Home</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="alert" class="mb-3"></div>

        <div class="card mb-4">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <strong><i class="bi bi-folder2-open"></i> Documenti conosciuti dall'IA
                    <span class="badge text-bg-light border" id="docCount">0</span></strong>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" id="reloadBtn" title="Rilegge l'elenco"><i class="bi bi-arrow-clockwise"></i></button>
                    <button class="btn btn-sm btn-outline-primary" id="reindexBtn"
                            title="Rimette in coda tutti i file salvati su S3 (rilancia gli embedding: costa qualche centesimo)">
                        <i class="bi bi-arrow-repeat"></i> Ricostruisci indice
                    </button>
                </div>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr><th>ID</th><th>File</th><th>Stato</th><th>Aggiornato</th><th class="text-end">Parti</th><th></th></tr>
                    </thead>
                    <tbody id="docsBody"><tr><td colspan="6" class="text-muted">Caricamento...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card d-none" id="chunksCard">
            <div class="card-header"><strong><i class="bi bi-text-paragraph"></i> Parti di <span id="chunksTitle"></span></strong></div>
            <div class="card-body" id="chunksBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
