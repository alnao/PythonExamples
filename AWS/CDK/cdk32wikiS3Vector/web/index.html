<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki S3 Vectors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container flex-wrap gap-2">
            <a class="navbar-brand" href="index.html"><i class="bi bi-search"></i> Wiki S3 Vectors</a>
            <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
                <span class="navbar-text">
                    <span id="statusIndicator" class="status-indicator status-checking"></span>
                    <span id="statusText">Verifica...</span>
                </span>
                <input type="password" class="form-control form-control-sm api-key" id="apiKey"
                       placeholder="API key" title="Chiave delle API (header X-API-Key), salvata in questo browser">
                <a class="btn btn-outline-light btn-sm" href="files.html"><i class="bi bi-folder2-open"></i> File</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container text-center">
            <h1 class="fw-bold mb-2">Cerca nei file</h1>
            <p class="lead mb-0">Ricerca semantica con Amazon S3 Vectors e Titan Embeddings, senza modello di chat</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="card endpoint-card mb-4">
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" class="form-control form-control-lg" id="question"
                           placeholder="es. esempio di Lambda che legge da una coda SQS">
                    <button class="btn btn-primary" id="searchBtn"><i class="bi bi-search"></i> Cerca</button>
                </div>
                <div class="row g-2">
                    <div class="col-md-5">
                        <label for="folder" class="form-label small mb-0">Solo nella cartella</label>
                        <input type="text" class="form-control form-control-sm" id="folder" list="folders"
                               placeholder="es. AWS/CDK (vuoto = tutte)">
                        <datalist id="folders"></datalist>
                    </div>
                    <div class="col-md-4">
                        <label for="extensions" class="form-label small mb-0">Solo i file</label>
                        <select class="form-select form-select-sm" id="extensions">
                            <option value="">tutti</option>
                            <option value=".md">documentazione (.md)</option>
                            <option value=".py">Python (.py)</option>
                            <option value=".js,.ts,.html,.css">web (.js .ts .html .css)</option>
                            <option value=".json,.yaml,.yml,.toml">configurazione (.json .yaml .toml)</option>
                            <option value=".sh,.bat">script (.sh .bat)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="topK" class="form-label small mb-0">Passaggi da cercare</label>
                        <select class="form-select form-select-sm" id="topK">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="index.js"></script>
</body>
</html>
