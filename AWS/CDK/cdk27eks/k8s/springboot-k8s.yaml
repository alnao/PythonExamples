# Microservizio Spring Boot dell'esempio JavaSpringBootExample (immagine su Docker Hub) con il database RDS del cdk27.
# Prima di applicarlo creare il secret "mysql" con endpoint e password del database (vedi README):
#   kubectl create secret generic mysql --from-literal=host=<MySQLEndpoint> --from-literal=password=<password>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          image: alnao/j-esempio02-backend-springboot:latest
          env:
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: host
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            - name: CUSTOM_MESSAGE
              value: "Sono un messaggio custom dall'ambiente EKS AWS creato con CDK (cdk27eks)"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/persone/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/persone/info
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-app-service
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # tag sul Network Load Balancer creato da Kubernetes (non gestito da CloudFormation)
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Name=aws-py-CDK.cdk27eks,Environment=dev,Project=Development.aws.py-CDK.cdk27eks,Owner=AlNao,CostCenter=dev,ManagedBy=Sh"
spec:
  type: LoadBalancer
  selector:
    app: springboot-app
  ports:
    - protocol: TCP
      port: 80          # porta del Service (e del load balancer)
      targetPort: 8080  # porta del container
---
# HorizontalPodAutoscaler: usa le metriche dell'add-on metrics-server installato dallo stack
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: springboot-app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: springboot-app
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
