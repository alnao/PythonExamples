services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "5433:5432"          # 5433 sull'host per non scontrarsi con un PostgreSQL locale
    volumes:
      - dati_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy   # parte solo quando PostgreSQL accetta connessioni
    environment:
      DATABASE_URL: postgresql+psycopg://biblioteca:biblioteca@db:5432/biblioteca
      SQL_ECHO: "0"
    ports:
      - "8000:8000"
    # prima le migrazioni, poi i dati di esempio, poi il server
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  adminer:
    image: adminer:latest
    depends_on:
      - db
    ports:
      - "8081:8080"          # interfaccia web su http://localhost:8081: server "db", utente/password/database "biblioteca"

volumes:
  dati_postgres:
